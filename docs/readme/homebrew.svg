<svg xmlns="http://www.w3.org/2000/svg" width="640" height="168" viewBox="0 0 640 168" role="img" aria-labelledby="title">
  <title id="title">Install with Homebrew: brew tap learntranscriber/tap, brew trust learntranscriber/tap, brew install --cask learntranscriber</title>
  <defs>
    <clipPath id="window"><rect width="640" height="168" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#window)">
    <rect width="640" height="168" fill="#1b1f27"/>
    <rect width="640" height="40" fill="#20242c"/>
  </g>
  <circle cx="22" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="20" r="6" fill="#febc2e"/>
  <circle cx="62" cy="20" r="6" fill="#28c840"/>
  <text x="320" y="25" text-anchor="middle" fill="#8b97a8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Install with Homebrew</text>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14.5" fill="#d6dde6">
    <text x="24" y="80"><tspan fill="#5a6577">$ </tspan><tspan fill="#82aaff">brew</tspan> tap learntranscriber/tap</text>
    <text x="24" y="108"><tspan fill="#5a6577">$ </tspan><tspan fill="#82aaff">brew</tspan> trust learntranscriber/tap</text>
    <text x="24" y="136"><tspan fill="#5a6577">$ </tspan><tspan fill="#82aaff">brew</tspan> install --cask learntranscriber</text>
  </g>
</svg>

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  include /etc/nginx/snippets/security-headers.conf;

  location = /health {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # The server config is not a page.
  location = /nginx.conf {
    return 404;
  }

  # Images, videos and fonts keep their names, so browsers can keep them for a month.
  location ~* \.(webp|jpg|png|mp4|woff2)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  # The page, the stylesheet and the script change with every release: revalidate each visit (ETag, 304).
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }
}
